apiVersion: v1
kind: ConfigMap
metadata:
  name: repairshop-config
  namespace: repairshop
  labels:
    app: repairshop
    env: local
data:
  SPRING_APPLICATION_NAME: repairshop
  SPRING_PROFILES_ACTIVE: local
  SPRING_MAIL_HOST: mailpit
  SPRING_MAIL_PORT: "1025"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-service:5432/repairshop
