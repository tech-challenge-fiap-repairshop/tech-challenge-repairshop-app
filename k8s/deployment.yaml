apiVersion: apps/v1
kind: Deployment
metadata:
  name: repairshop-app
  namespace: repairshop
  labels:
    app: repairshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repairshop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: repairshop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: repairshop
          image: ECR_REGISTRY/repairshop:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: "repairshop-app"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
          envFrom:
            - configMapRef:
                name: repairshop-config
            - configMapRef:
                name: repairshop-db-config
            - secretRef:
                name: repairshop-db-credentials
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: "1Gi"
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: "2Gi"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: tmp-volume
          emptyDir: {}
