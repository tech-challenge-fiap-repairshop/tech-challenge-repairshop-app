apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: repairshop
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          args:
            - "-config.file=/etc/loki/local-config.yaml"
          ports:
            - containerPort: 3100
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: loki-config-val
              mountPath: /etc/loki
            - name: loki-storage
              mountPath: /tmp/loki
      volumes:
        - name: loki-config-val
          configMap:
            name: loki-config
            items:
              - key: loki.yml
                path: local-config.yaml
        - name: loki-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: repairshop
  labels:
    app: loki
spec:
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: loki
