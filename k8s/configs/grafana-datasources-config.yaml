apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-config
  namespace: repairshop
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1

    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Jaeger
        orgId: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        uid: Prometheus
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          httpMethod: POST
          timeInterval: 5s
        editable: true

      - name: Loki
        type: loki
        access: proxy
        uid: Loki
        url: http://loki:3100
        jsonData:
          maxLines: 1000
        editable: true

      - name: Jaeger
        type: jaeger
        access: proxy
        uid: Jaeger
        url: http://jaeger:16686
        editable: true
