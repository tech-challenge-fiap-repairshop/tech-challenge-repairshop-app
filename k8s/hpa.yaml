apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: repairshop-hpa
  namespace: repairshop
  labels:
    app: repairshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: repairshop-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
