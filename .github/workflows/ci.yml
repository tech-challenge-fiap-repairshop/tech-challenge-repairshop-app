name: 🚀 Application CI/CD Pipeline

# =================================================================================================================================
# PIPELINE — Ciclo de Vida da Aplicação e Deploy no EKS (Nativo)
#   ┌────────────────┐     ┌──────────┐     ┌──────────────┐     ┌──────────────┐     ┌───────────┐     ┌──────────┐
#   │ Build & Smoke  │────▶│  Test    │────▶│   Quality    │────▶│  Container,  │────▶│  Approve  │────▶│  Deploy  │
#   │   (Compile)    │     │ Unit+IT  │     │ Gate (Sonar) │     │ Sec & Smoke  │     │ (Manual)  │     │  (Prod)  │
#   └────────────────┘     └──────────┘     └──────────────┘     └──────────────┘     └───────────┘     └──────────┘
# =================================================================================================================================

on:
  push:
    branches: [ 'main', 'develop' ]
    paths:
      - 'infra/**'
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ 'main', 'develop' ]
    paths:
      - 'infra/**'
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  JAVA_VERSION: '24'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # =====================================================================================================================
  # STAGE 0 — INFRASTRUCTURE: Provisionamento de Infraestrutura AWS via Terraform (Nativo)
  # =====================================================================================================================
  terraform:
    name: "🛠️ Provision Infrastructure (Terraform)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TF_VAR_db_username: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      TF_VAR_db_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Ensure S3 Bucket for Terraform State exists
        run: |
          BUCKET_NAME="fiap-repairshop2"
          AWS_REGION="us-east-1"
          
          # Verifica se o bucket existe na conta AWS
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket $BUCKET_NAME já existe."
          else
            echo "Bucket $BUCKET_NAME não existe. Criando..."
            aws s3api create-bucket --bucket "$BUCKET_NAME" --region "$AWS_REGION"
            
            # Habilita versionamento (essencial para histórico do tfstate)
            aws s3api put-bucket-versioning --bucket "$BUCKET_NAME" --versioning-configuration Status=Enabled
            
            # Habilita criptografia AES256 no bucket
            aws s3api put-bucket-encryption --bucket "$BUCKET_NAME" --server-side-encryption-configuration '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'
            
            # Bloqueia todos os acessos públicos ao bucket (Segurança)
            aws s3api put-public-access-block --bucket "$BUCKET_NAME" --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }'
          fi


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.8.5"

      - name: Terraform Init
        run: |
          cd infra/terraform/cloud && terraform init

      - name: Terraform Plan
        run: |
          cd infra/terraform/cloud && terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          cd infra/terraform/cloud && terraform apply -auto-approve

  # ==========================================================================
  # STAGE 1 — BUILD: Compila o projeto, empacota e realiza teste de fumaça
  # ==========================================================================
  build:
    name: "🏗️ Build & Smoke Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile project (skip tests)
        run: mvn clean compile -B -ntp -DskipTests

      - name: Package application (skip tests)
        run: mvn package -B -ntp -DskipTests

      - name: Start dependencies (Postgres & Mailpit)
        run: docker compose up -d postgres mailpit


      - name: Run Application JAR
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
        run: |
          docker run -d --name smoke-jar --network host --add-host mailpit:127.0.0.1 \
            -v ${{ github.workspace }}:/app \
            -w /app \
            -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            -e SPRING_MAIL_HOST="$SPRING_MAIL_HOST" \
            -e SPRING_MAIL_PORT="$SPRING_MAIL_PORT" \
            -e JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS" \
            eclipse-temurin:24-jre java -jar target/repairshop-0.0.1-SNAPSHOT.jar

      - name: Verify application startup (Actuator Health Check)
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Post-Build Smoke Test Passed! Application is UP."
              docker stop smoke-jar
              docker rm smoke-jar
              docker compose down
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Post-Build Smoke Test Failed! Application log output:"
          docker logs smoke-jar
          docker stop smoke-jar
          docker rm smoke-jar
          docker compose down
          exit 1

  # ==========================================================================
  # STAGE 2 — TEST: Testes unitários + integração (Testcontainers) + JaCoCo
  # ==========================================================================
  test:
    name: "🧪 Test"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run tests and generate JaCoCo report
        run: mvn clean verify -B -ntp
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 1

  # ==========================================================================
  # STAGE 3 — QUALITY GATE: SonarCloud analysis + coverage report
  # ==========================================================================
  quality:
    name: "🔍 Quality Gate (SonarCloud)"
    needs: test
    if: |
      needs.test.result == 'success' &&
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download coverage report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-report
          path: target/

      - name: Recompile for Sonar binaries
        run: mvn compile -B -ntp -DskipTests

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp sonar:sonar
          -Dsonar.projectKey=repairshop
          -Dsonar.organization=alexandre-agamin
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.java.binaries=target/classes
          -Dsonar.kotlin.binaries=target/classes

  # ==========================================================================
  # STAGE 4 — CONTAINER & SECURITY: Build Docker, Scan Trivy e Push (GHCR)
  # ==========================================================================
  docker-build-push:
    name: "🐳 Docker Build & Trivy Scan"
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.0.1

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.login-ecr.outputs.registry }}/repairshop:latest

      - name: Cache Trivy Vulnerability Database
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/repairshop:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Start dependencies (Postgres & Mailpit)
        run: docker compose -p repairshop up -d postgres mailpit


      - name: Run Smoke Test (Start application container)
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
        run: |
          docker run -d --name smoke-app --network host --add-host mailpit:127.0.0.1 \
            -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            -e SPRING_MAIL_HOST="$SPRING_MAIL_HOST" \
            -e SPRING_MAIL_PORT="$SPRING_MAIL_PORT" \
            -e JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS" \
            ${{ steps.login-ecr.outputs.registry }}/repairshop:latest

      - name: Verify application startup (Actuator Health Check)
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Smoke Test Passed! Application is UP."
              docker stop smoke-app
              docker rm smoke-app
              docker compose down
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Smoke Test Failed! Container logs:"
          docker logs smoke-app
          docker stop smoke-app
          docker rm smoke-app
          docker compose down
          exit 1

      - name: Push Docker image to Amazon ECR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          # Push para o Amazon ECR (Nativo AWS)
          docker push ${{ steps.login-ecr.outputs.registry }}/repairshop:latest

  # ==========================================================================
  # STAGE 5 — APPROVAL: Aprovação Manual para Deploy em Produção
  # ==========================================================================
  approve-deploy:
    name: "⏳ Approve Deployment"
    needs: [docker-build-push, terraform]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Manual Approval
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Deploying to Production (EKS)"
          issue-body: "Please approve or deny the deployment of version ${{ github.sha }} to AWS EKS."

  # ==========================================================================
  # STAGE 6 — DEPLOY: Deploy final no Kubernetes EKS (Sincronizado)
  # ==========================================================================
  deploy:
    name: "🚀 Continuous Deployment to EKS"
    needs: approve-deploy
    if: needs.approve-deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Set up Kubeconfig from EKS
        run: |
          echo "Setting up Kubernetes credentials using AWS EKS CLI..."
          aws eks update-kubeconfig --region us-east-1 --name repairshop-eks

      - name: Prepare Deployment Manifests
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Using Account ID: $ACCOUNT_ID"
          sed -i "s|<SUA_CONTA_AWS>|${ACCOUNT_ID}|g" k8s/deploy/kustomization.yaml
          sed -i "s|DB_USERNAME|${{ secrets.SPRING_DATASOURCE_USERNAME }}|g" k8s/secret.yaml
          sed -i "s|DB_PASSWORD|${{ secrets.SPRING_DATASOURCE_PASSWORD }}|g" k8s/secret.yaml

      - name: Apply Manifests
        run: |
          echo "Applying Kubernetes manifests via Kustomize..."
          kubectl kustomize k8s/deploy/ | kubectl apply -f -

      - name: Wait for Deployment Rollout
        run: |
          echo "Aguardando a inicialização e prontidão dos novos pods..."
          kubectl rollout status deployment/repairshop-app -n repairshop --timeout=5m


