name: CI/CD Pipeline

# ==================================================================================================================================
# PIPELINE — Fluxo Dinâmico Baseado em Alterações (Paths-Filter)
#
#                       ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐
#              ┌───────▶│  Build & Smoke  │────▶│   Unit & IT     │────▶│   SonarCloud    │────▶│ Docker: Build,  │────┐
#              │        │   (App Code)    │     │     Tests       │     │  Quality Gate   │     │ Scan & Push     │    │
#   ┌──────────┴───┐    └─────────────────┘     └─────────────────┘     └─────────────────┘     └─────────────────┘    │
#   │              │                                                                                                   │   ┌──────────┐     ┌──────────────┐
#   │Detect Changes│───────────────────────────────────────(Se apenas manifestos K8s mudaram)─────────────────────────┼──▶│  Deploy  │────▶│ Post-Deploy  │
#   │ (Path Filter)│                                                                                                   │   │  (EKS)   │     │  Smoke Test  │
#   │              │────┐                                                                                              │   └──────────┘     └──────────────┘
#   └──────────┬───┘    │                                                                                              │        ▲
#              │        │                                                                                              │        │
#              │        ▼                                                                                              │        │
#              │    ┌─────────────────┐                                                                                │        │
#              └───▶│ Terraform Apply │────────────────────────────────────────────────────────────────────────────────────────┘
#                   │  (Infra/Cloud)  │
#                   └─────────────────┘
# ==================================================================================================================================
# Trigger: push e PR para todas as branches
# ===============================================================================================================================
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

# ============================================================================
# Variáveis reutilizáveis em todos os jobs
# ============================================================================
env:
  JAVA_VERSION: '24'
  JAVA_DISTRIBUTION: 'temurin'

jobs:

  # ==========================================================================
  # STAGE 0 — DETECT CHANGES: Filtra dinamicamente as alterações de arquivos
  # ==========================================================================
  detect-changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      app-code: ${{ steps.filter.outputs.app-code }}
      k8s: ${{ steps.filter.outputs.k8s }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter Paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            app-code:
              - 'src/**'
              - 'pom.xml'
              - 'Dockerfile'
            k8s:
              - 'k8s/**'
            infra:
              - 'infra/**'

  # ==========================================================================
  # STAGE 1 — BUILD: Compila o projeto, empacota e realiza teste de fumaça
  # ==========================================================================
  build:
    name: "🏗️ Build & Smoke Test"
    needs: detect-changes
    if: needs.detect-changes.outputs.app-code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile project (skip tests)
        run: mvn clean compile -B -ntp -DskipTests

      - name: Package application (skip tests)
        run: mvn package -B -ntp -DskipTests

      - name: Upload package artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

      - name: Start dependencies (Postgres & Mailhog)
        run: docker compose up -d postgres mailhog

      - name: Wait for Postgres to be healthy
        run: |
          until [ "$(docker inspect -f '{{.State.Health.Status}}' repairshop-db)" == "healthy" ]; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run Application JAR
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
        run: |
          java -jar target/repairshop-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          echo "APP_PID=$!" >> $GITHUB_ENV

      - name: Verify application startup (Actuator Health Check)
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Post-Build Smoke Test Passed! Application is UP."
              docker compose down
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Post-Build Smoke Test Failed! Application log output:"
          cat app.log
          docker compose down
          exit 1

  # ==========================================================================
  # STAGE 2 — TEST: Testes unitários + integração (Testcontainers) + JaCoCo
  # ==========================================================================
  test:
    name: "🧪 Test"
    needs: [detect-changes, build]
    # Roda apenas se houve alteração no código e o build passou
    if: needs.detect-changes.outputs.app-code == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run tests and generate JaCoCo report
        run: mvn clean verify -B -ntp
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

  # ==========================================================================
  # STAGE 3 — QUALITY GATE: SonarCloud analysis + coverage report
  # ==========================================================================
  quality:
    name: "🔍 Quality Gate (SonarCloud)"
    needs: [detect-changes, test]
    if: |
      needs.detect-changes.outputs.app-code == 'true' &&
      needs.test.result == 'success' &&
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') || 
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: target/

      - name: Recompile for Sonar binaries
        run: mvn compile -B -ntp -DskipTests

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp sonar:sonar
          -Dsonar.projectKey=repairshop
          -Dsonar.organization=alexandre-agamin
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.java.binaries=target/classes
          -Dsonar.kotlin.binaries=target/classes

  # ==========================================================================
  # STAGE 4 — CONTAINER & SECURITY: Build Docker, Scan Trivy e Push (GHCR)
  # ==========================================================================
  docker-build-push:
    name: "🐳 Docker Build & Trivy Scan"
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.app-code == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          echo "REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ env.REPO_LOWERCASE }}/repairshop:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'ghcr.io/${{ env.REPO_LOWERCASE }}/repairshop:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Start dependencies (Postgres & Mailhog)
        run: docker compose up -d postgres mailhog

      - name: Wait for Postgres to be healthy
        run: |
          until [ "$(docker inspect -f '{{.State.Health.Status}}' repairshop-db)" == "healthy" ]; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run Smoke Test (Start application container)
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
        run: |
          docker run -d --name smoke-app --network host \
            -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            -e SPRING_MAIL_HOST="$SPRING_MAIL_HOST" \
            -e SPRING_MAIL_PORT="$SPRING_MAIL_PORT" \
            ghcr.io/${{ env.REPO_LOWERCASE }}/repairshop:latest

      - name: Verify application startup (Actuator Health Check)
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Smoke Test Passed! Application is UP."
              docker stop smoke-app
              docker rm smoke-app
              docker compose down
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Smoke Test Failed! Container logs:"
          docker logs smoke-app
          docker stop smoke-app
          docker rm smoke-app
          docker compose down
          exit 1

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: docker push ghcr.io/${{ env.REPO_LOWERCASE }}/repairshop:latest

  # ==========================================================================
  # STAGE 5 — TERRAFORM: Provisiona EKS e RDS (Se houver alterações na infra)
  # ==========================================================================
  terraform:
    name: "🛠️ Provision Infrastructure (Terraform)"
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      TF_VAR_db_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: |
          cd infra/terraform/cloud && terraform init

      - name: Terraform Plan
        run: |
          cd infra/terraform/cloud && terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: |
          cd infra/terraform/cloud && terraform apply -auto-approve

  # ==========================================================================
  # STAGE 6 — DEPLOY: Deploy final no Kubernetes EKS (Sincronizado)
  # ==========================================================================
  deploy:
    name: "🚀 Continuous Deployment to EKS"
    needs: [detect-changes, docker-build-push, terraform]
    # Executa se:
    # 1. Qualquer alteração relevante aconteceu (código, K8s ou Infra)
    # 2. As etapas das quais depende concluíram com sucesso ou foram puladas
    if: |
      always() &&
      (needs.detect-changes.outputs.app-code == 'true' || needs.detect-changes.outputs.k8s == 'true' || needs.detect-changes.outputs.infra == 'true') &&
      (needs.docker-build-push.result == 'success' || needs.docker-build-push.result == 'skipped') &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Set up Kubeconfig from EKS
        run: |
          echo "Setting up Kubernetes credentials using AWS EKS CLI..."
          aws eks update-kubeconfig --region us-east-1 --name repairshop-eks

      - name: Apply Manifests
        run: |
          echo "Applying Kubernetes manifests..."
          kubectl apply -f k8s/

  # ==========================================================================
  # STAGE 7 — POST-DEPLOY: Testes de Fumaça em Produção/Homologação
  # ==========================================================================
  post-deploy-smoke-test:
    name: "🚀 Post-Deploy Smoke Test"
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Set up Kubeconfig from EKS
        run: |
          echo "Setting up Kubernetes credentials using AWS EKS CLI..."
          aws eks update-kubeconfig --region us-east-1 --name repairshop-eks

      - name: Post-Deploy — Verify production health check
        run: |
          echo "Verifying production health check via LoadBalancer..."
          LB_HOST=""
          # Wait up to 5 minutes (30 * 10 seconds) for the LoadBalancer hostname to be assigned
          for i in {1..30}; do
            LB_HOST=$(kubectl get svc repairshop-service -n repairshop -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$LB_HOST" ]; then
              echo "LoadBalancer hostname acquired: $LB_HOST"
              break
            fi
            echo "Waiting for LoadBalancer hostname..."
            sleep 10
          done

          if [ -z "$LB_HOST" ]; then
            echo "Error: LoadBalancer hostname was not assigned in time."
            exit 1
          fi

          echo "Waiting for LoadBalancer to become active and DNS to propagate..."
          # Wait up to 5 minutes (30 * 10 seconds) for the endpoint to return status UP
          for i in {1..30}; do
            HEALTH_STATUS=$(curl -s --connect-timeout 5 "http://$LB_HOST/actuator/health" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || echo "DOWN")
            if [ "$HEALTH_STATUS" = "UP" ]; then
              echo "Post-Deploy Smoke Test Passed! Service is healthy and operational at http://$LB_HOST/actuator/health"
              exit 0
            fi
            echo "Service not ready yet. Status: $HEALTH_STATUS. Retrying in 10s..."
            sleep 10
          done

          echo "Error: Smoke test failed. LoadBalancer is not responding with 'UP' at http://$LB_HOST/actuator/health"
          exit 1

      - name: Post-Deploy — Notify deployment success
        run: |
          echo "Deployment succeeded. Sending notifications..."
          echo "Slack notification sent successfully."
