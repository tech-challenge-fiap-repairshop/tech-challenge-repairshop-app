name: CI/CD Pipeline

# ============================================================================
# Trigger: push e PR para branches protegidas
# ============================================================================
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

# ============================================================================
# Variáveis reutilizáveis em todos os jobs
# ============================================================================
env:
  JAVA_VERSION: '24'
  JAVA_DISTRIBUTION: 'temurin'

# ============================================================================
# PIPELINE — Jobs separados por responsabilidade
#   ┌──────────┐     ┌──────────┐     ┌──────────┐     ┌──────────────┐     ┌──────────────┐     ┌──────────┐     ┌──────────────┐
#   │  Build   │────▶│Post-Build│────▶│  Test    │────▶│   Quality    │────▶│  Container,  │────▶│  Deploy  │────▶│ Post-Deploy  │
#   │ Compile  │     │Smoke Test│     │ Unit+IT  │     │ Gate (Sonar) │     │ Sec & Smoke  │     │  (Prod)  │     │  Smoke Test  │
#   └──────────┘     └──────────┘     └──────────┘     └──────────────┘     └──────────────┘     └──────────┘     └──────────────┘
# ============================================================================
jobs:

  # ==========================================================================
  # STAGE 1 — BUILD: Compila o projeto e empacota o artefato (JAR)
  # ==========================================================================
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile project (skip tests)
        run: mvn clean compile -B -ntp -DskipTests

      - name: Package application (skip tests)
        run: mvn package -B -ntp -DskipTests

      - name: Upload package artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # ==========================================================================
  # STAGE 1.5 — POST-BUILD SMOKE TEST: Teste de fumaça executando o JAR
  # ==========================================================================
  post-build-smoke-test:
    name: "🧪 Post-Build Smoke Test"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Download package artifact (JAR)
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Start dependencies (Postgres & Mailhog)
        run: docker compose up -d postgres mailhog

      - name: Wait for Postgres to be healthy
        run: |
          until [ "$(docker inspect -f '{{.State.Health.Status}}' repairshop-db)" == "healthy" ]; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run Application JAR
        run: |
          java -jar target/repairshop-0.0.1-SNAPSHOT.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/repairshop \
            --spring.datasource.username=repairshop \
            --spring.datasource.password=repairshop \
            --spring.mail.host=localhost \
            --spring.mail.port=1025 > app.log 2>&1 &
          echo "APP_PID=$!" >> $GITHUB_ENV

      - name: Verify application startup (Actuator Health Check)
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Post-Build Smoke Test Passed! Application is UP."
              docker compose down
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Post-Build Smoke Test Failed! Application log output:"
          cat app.log
          docker compose down
          exit 1

  # ==========================================================================
  # STAGE 2 — TEST: Testes unitários + integração (Testcontainers) + JaCoCo
  # ==========================================================================
  test:
    name: "🧪 Test"
    needs: post-build-smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run tests and generate JaCoCo report
        run: mvn clean verify -B -ntp
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

  # ==========================================================================
  # STAGE 3 — QUALITY GATE: SonarCloud analysis + coverage report
  # ==========================================================================
  quality:
    name: "🔍 Quality Gate (SonarCloud)"
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # Só roda se NÃO for um PR de um fork
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud blame data

      - name: Set up JDK 17 (required by SonarCloud Scanner)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: target/

      - name: Recompile for Sonar binaries
        run: mvn compile -B -ntp -DskipTests

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp sonar:sonar
          -Dsonar.projectKey=repairshop
          -Dsonar.organization=alexandre-agamin
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.java.binaries=target/classes
          -Dsonar.kotlin.binaries=target/classes

  # ==========================================================================
  # STAGE 4 — CONTAINER & SECURITY: Build Docker, Scan Trivy e Push (GHCR)
  # ==========================================================================
  docker-build-push:
    name: "🐳 Docker Build & Trivy Scan"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          echo "REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ env.REPO_LOWERCASE }}/repairshop:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.REPO_LOWERCASE }}/repairshop:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Start dependencies (Postgres & Mailhog)
        run: docker compose up -d postgres mailhog

      - name: Wait for Postgres to be healthy
        run: |
          until [ "$(docker inspect -f '{{.State.Health.Status}}' repairshop-db)" == "healthy" ]; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run Smoke Test (Start application container)
        run: |
          docker run -d --name smoke-app --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/repairshop \
            -e SPRING_DATASOURCE_USERNAME=repairshop \
            -e SPRING_DATASOURCE_PASSWORD=repairshop \
            -e SPRING_MAIL_HOST=localhost \
            -e SPRING_MAIL_PORT=1025 \
            ghcr.io/${{ env.REPO_LOWERCASE }}/repairshop:latest

      - name: Verify application startup (Actuator Health Check)
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Smoke Test Passed! Application is UP."
              docker stop smoke-app
              docker rm smoke-app
              docker compose down
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Smoke Test Failed! Container logs:"
          docker logs smoke-app
          docker stop smoke-app
          docker rm smoke-app
          docker compose down
          exit 1

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: docker push ghcr.io/${{ env.REPO_LOWERCASE }}/repairshop:latest

  # ==========================================================================
  # STAGE 5 — DEPLOY (Placeholder)
  # ==========================================================================
  deploy:
    name: "🚀 Continuous Deployment"
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Kubernetes
        run: |
          echo "Preparing deployment to Production..."
          echo "kubectl apply -f k8s/"
          echo "Deploy completed!"

  # ==========================================================================
  # STAGE 5.5 — POST-DEPLOY SMOKE TEST: Validação em Produção & Notificações
  # ==========================================================================
  post-deploy-smoke-test:
    name: "🚀 Post-Deploy Smoke Test"
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Post-Deploy — Verify production health check
        run: |
          echo "Verifying production health check..."
          echo "curl -f -s https://api.repairshop.exemplo/actuator/health"
          echo "Production is healthy and fully operational!"

      - name: Post-Deploy — Notify deployment success
        run: |
          echo "Deployment succeeded. Sending notifications..."
          echo "Slack notification sent successfully."
