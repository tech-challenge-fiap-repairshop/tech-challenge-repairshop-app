name: 🚀 Application CI/CD Pipeline

# =================================================================================================================================
# PIPELINE — Ciclo de Vida da Aplicação e Deploy no EKS via GitOps / Kustomize
#   ┌────────────────┐     ┌──────────┐     ┌──────────────┐     ┌──────────────┐     ┌───────────┐     ┌──────────┐
#   │ Build & Smoke  │────▶│  Test    │────▶│   Quality    │────▶│  Container,  │────▶│  Approve  │────▶│  Deploy  │
#   │   (Compile)    │     │ Unit+IT  │     │ Gate (Sonar) │     │ Sec & Smoke  │     │ (Manual)  │     │ (K8s/Env)│
#   └────────────────┘     └──────────┘     └──────────────┘     └──────────────┘     └───────────┘     └──────────┘
# =================================================================================================================================

on:
  push:
    branches: [ 'main', 'homolog', 'develop' ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ 'main', 'homolog', 'develop' ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'k8s/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Ambiente de Deploy (dev, hml, prd)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - hml
          - prd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '24'
  JAVA_DISTRIBUTION: 'temurin'
  AWS_REGION: 'us-east-1'

jobs:
  # ==========================================================================
  # STAGE 1 — BUILD: Compila o projeto, empacota e realiza teste de fumaça
  # ==========================================================================
  build:
    name: "🏗️ Build & Smoke Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile project (skip tests)
        run: mvn clean compile -B -ntp -DskipTests

      - name: Package application (skip tests)
        run: mvn package -B -ntp -DskipTests

      - name: Start dependencies (Postgres & Mailpit)
        run: docker compose up -d postgres mailpit

      - name: Run Application JAR
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL || 'jdbc:postgresql://localhost:5432/repairshop' }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME || 'repairshop' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD || 'repairshop' }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST || 'localhost' }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT || '1025' }}
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
        run: |
          docker run -d --name smoke-jar --network host --add-host mailpit:127.0.0.1 \
            -v ${{ github.workspace }}:/app \
            -w /app \
            -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            -e SPRING_MAIL_HOST="$SPRING_MAIL_HOST" \
            -e SPRING_MAIL_PORT="$SPRING_MAIL_PORT" \
            -e JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS" \
            eclipse-temurin:24-jre java -jar target/repairshop-0.0.1-SNAPSHOT.jar

      - name: Verify application startup (Actuator Health Check)
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Post-Build Smoke Test Passed! Application is UP."
              docker stop smoke-jar
              docker rm smoke-jar
              docker compose down
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Post-Build Smoke Test Failed! Application log output:"
          docker logs smoke-jar
          docker stop smoke-jar
          docker rm smoke-jar
          docker compose down
          exit 1

  # ==========================================================================
  # STAGE 2 — TEST: Testes unitários + integração (Testcontainers) + JaCoCo
  # ==========================================================================
  test:
    name: "🧪 Test"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run tests and generate JaCoCo report
        run: mvn clean verify -B -ntp
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report
          path: |
            target/site/jacoco/
            target/jacoco.exec
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 1

  # ==========================================================================
  # STAGE 3 — QUALITY GATE: SonarCloud analysis + coverage report
  # ==========================================================================
  quality:
    name: "🔍 Quality Gate (SonarCloud)"
    needs: test
    if: |
      needs.test.result == 'success' &&
      ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/homolog') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download coverage report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-report
          path: target/

      - name: Recompile for Sonar binaries
        run: mvn compile -B -ntp -DskipTests

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -ntp sonar:sonar
          -Dsonar.projectKey=repairshop
          -Dsonar.organization=alexandre-agamin
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.java.binaries=target/classes
          -Dsonar.kotlin.binaries=target/classes

  # ==========================================================================
  # STAGE 4 — CONTAINER & SECURITY: Build Docker, Scan Trivy e Push (ECR)
  # ==========================================================================
  docker-build-push:
    name: "🐳 Docker Build & Trivy Scan"
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.0.1

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/repairshop:latest
            ${{ steps.login-ecr.outputs.registry }}/repairshop:${{ github.sha }}

      - name: Cache Trivy Vulnerability Database
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/repairshop:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Start dependencies (Postgres & Mailpit)
        run: docker compose -p repairshop up -d postgres mailpit

      - name: Run Smoke Test (Start application container)
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL || 'jdbc:postgresql://localhost:5432/repairshop' }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME || 'repairshop' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD || 'repairshop' }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST || 'localhost' }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT || '1025' }}
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
        run: |
          docker run -d --name smoke-app --network host --add-host mailpit:127.0.0.1 \
            -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            -e SPRING_MAIL_HOST="$SPRING_MAIL_HOST" \
            -e SPRING_MAIL_PORT="$SPRING_MAIL_PORT" \
            -e JAVA_TOOL_OPTIONS="$JAVA_TOOL_OPTIONS" \
            ${{ steps.login-ecr.outputs.registry }}/repairshop:latest

      - name: Verify application startup (Actuator Health Check)
        run: |
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Smoke Test Passed! Application is UP."
              docker stop smoke-app
              docker rm smoke-app
              docker compose down
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Smoke Test Failed! Container logs:"
          docker logs smoke-app
          docker stop smoke-app
          docker rm smoke-app
          docker compose down
          exit 1

      - name: Push Docker image to Amazon ECR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/homolog' || github.event_name == 'workflow_dispatch'
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/repairshop:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/repairshop:${{ github.sha }}

  # ==========================================================================
  # STAGE 5 — APPROVAL: Aprovação Manual para Deploy em Produção (Main)
  # ==========================================================================
  approve-deploy:
    name: "⏳ Approve Deployment"
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/homolog' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Manual Approval (Produção apenas)
        if: github.ref == 'refs/heads/main'
        uses: trstringer/manual-approval@74d99dff7380e3e4b122d4ededcbca2b6ce59367
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Deploying to Production (EKS)"
          issue-body: "Please approve or deny the deployment of version ${{ github.sha }} to AWS EKS."

  # ==========================================================================
  # STAGE 6 — DEPLOY: Deploy no Kubernetes EKS via Kustomize
  # ==========================================================================
  deploy:
    name: "🚀 Deploy to EKS (Kustomize)"
    needs: approve-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine Target Environment
        id: env-target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target_env }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="prd"
          elif [ "${{ github.ref }}" = "refs/heads/homolog" ]; then
            TARGET="hml"
          else
            TARGET="dev"
          fi
          echo "environment=${TARGET}" >> $GITHUB_OUTPUT
          echo "cluster_name=repairshop-eks-${TARGET}" >> $GITHUB_OUTPUT
          echo "Target Environment: ${TARGET}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Kubeconfig from EKS
        run: |
          CLUSTER="${{ steps.env-target.outputs.cluster_name }}"
          echo "Configuring Kubeconfig for cluster: $CLUSTER..."
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "$CLUSTER"

      - name: Prepare Deployment & Secrets
        env:
          DB_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DB_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "Using ECR Registry: $ECR_REGISTRY"
          
          # Injeta ECR Registry na imagem do deployment
          sed -i "s|ECR_REGISTRY|${ECR_REGISTRY}|g" k8s/deployment.yaml

          # Busca dinamicamente o endpoint do RDS PostgreSQL
          ENV_NAME="${{ steps.env-target.outputs.environment }}"
          CLUSTER_NAME="${{ steps.env-target.outputs.cluster_name }}"
          RDS_IDENTIFIER="${CLUSTER_NAME}-postgres"
          
          echo "Buscando endpoint do RDS para ${RDS_IDENTIFIER}..."
          RDS_HOST=$(aws rds describe-db-instances --db-instance-identifier "${RDS_IDENTIFIER}" --region "${{ env.AWS_REGION }}" --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          
          if [ -n "$RDS_HOST" ] && [ "$RDS_HOST" != "None" ]; then
            echo "✅ RDS Host encontrado: $RDS_HOST"
            sed -i "s|localhost:5432|${RDS_HOST}:5432|g" "k8s/configmap/configmap-${ENV_NAME}.yaml"
          else
            echo "⚠️ RDS Host não encontrado dinamicamente para '${RDS_IDENTIFIER}'. Mantendo configuração padrão."
          fi
          
          # Injeta credenciais seguras no secret se fornecidas nas Secrets do repositório
          if [ -n "$DB_USERNAME" ]; then
            sed -i "s|SPRING_DATASOURCE_USERNAME: .*|SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}|g" k8s/secret.yaml
            sed -i "s|POSTGRES_USER: .*|POSTGRES_USER: ${DB_USERNAME}|g" k8s/secret.yaml
          fi
          if [ -n "$DB_PASSWORD" ]; then
            sed -i "s|SPRING_DATASOURCE_PASSWORD: .*|SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}|g" k8s/secret.yaml
            sed -i "s|POSTGRES_PASSWORD: .*|POSTGRES_PASSWORD: ${DB_PASSWORD}|g" k8s/secret.yaml
          fi
          if [ -n "$JWT_SECRET" ]; then
            sed -i "s|JWT_SECRET: .*|JWT_SECRET: ${JWT_SECRET}|g" k8s/secret.yaml
          fi

      - name: Deploy Kubernetes Manifests
        run: |
          ENV_NAME="${{ steps.env-target.outputs.environment }}"
          
          echo "Garantindo criação do namespace 'repairshop'..."
          kubectl apply -f k8s/namespace.yaml
          
          echo "Aplicando configurações específicas de observabilidade (k8s/configs/)..."
          kubectl apply -f k8s/configs/
          
          echo "Aplicando manifestos principais da aplicação e serviços (k8s/)..."
          kubectl apply -f k8s/
          
          echo "Aplicando ConfigMap do ambiente: ${ENV_NAME}..."
          kubectl apply -f "k8s/configmap/configmap-${ENV_NAME}.yaml"

      - name: Wait for Deployment Rollout
        run: |
          echo "Aguardando a inicialização e prontidão dos novos pods..."
          kubectl rollout status deployment/repairshop-app -n repairshop --timeout=5m
