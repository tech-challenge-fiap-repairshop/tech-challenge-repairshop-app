name: Infrastructure & Kubernetes CD

# ============================================================================
# Trigger: Roda de forma encadeada apenas após a conclusão bem-sucedida da CI/CD da App
# ============================================================================
on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed

permissions:
  contents: read

jobs:

  # ==========================================================================
  # STAGE 1 — TERRAFORM: Planeja ou aplica modificações de infraestrutura
  # ==========================================================================
  terraform:
    name: "🛠️ Provision Infrastructure (Terraform)"
    # Roda apenas se a pipeline principal (CI/CD Pipeline) terminou com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Passa a senha do RDS obtida dos Secrets para o Terraform de forma automatizada
      TF_VAR_db_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Necessário para AWS Academy / LabRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: |
          echo "Executing terraform init..."
          cd infra/terraform/cloud && terraform init

      - name: Terraform Plan
        run: |
          echo "Executing terraform plan..."
          cd infra/terraform/cloud && terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Executing terraform apply..."
          cd infra/terraform/cloud && terraform apply -auto-approve

  # ==========================================================================
  # STAGE 2 — KUBERNETES DEPLOY: Aplica manifestos K8s atualizados
  # ==========================================================================
  kubernetes-deploy:
    name: "🚀 Deploy Manifests to Kubernetes"
    needs: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Necessário para AWS Academy / LabRole
          aws-region: us-east-1

      - name: Set up Kubeconfig from EKS
        run: |
          echo "Setting up Kubernetes credentials using AWS EKS CLI..."
          aws eks update-kubeconfig --region us-east-1 --name repairshop-eks

      - name: Apply Manifests
        run: |
          echo "Applying Kubernetes manifests..."
          kubectl apply -f k8s/
