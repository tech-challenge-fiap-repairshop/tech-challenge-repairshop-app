name: 💥 Destroy Workloads on EKS (Manual)

# ============================================================================
# Trigger: Gatilho manual para limpeza dos workloads no cluster EKS
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente para remoção dos recursos (dev, hml, prd)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - hml
          - prd
      confirm_destroy:
        description: 'Digite "DESTRUIR" em letras maiúsculas para confirmar'
        required: true
        default: 'NAO'

permissions:
  contents: read

jobs:
  destroy-workloads:
    name: "💥 Delete Kubernetes Workloads"
    if: ${{ github.event.inputs.confirm_destroy == 'DESTRUIR' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Necessário para AWS Academy / LabRole
          aws-region: us-east-1

      - name: Set up Kubeconfig from EKS
        run: |
          CLUSTER_NAME="repairshop-eks-${{ github.event.inputs.environment }}"
          echo "Configuring Kubeconfig for cluster: $CLUSTER_NAME..."
          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME" || echo "Cluster EKS não encontrado ou inacessível."

      - name: Delete Application Workloads, ConfigMap & Configs
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"
          echo "Removendo ConfigMap do ambiente $ENV_NAME..."
          kubectl delete -f "k8s/configmap/configmap-${ENV_NAME}.yaml" --ignore-not-found=true || true
          echo "Removendo manifestos da aplicação e observabilidade em k8s/..."
          kubectl delete -f k8s/ --ignore-not-found=true || true
          echo "Removendo configurações em k8s/configs/..."
          kubectl delete -f k8s/configs/ --ignore-not-found=true || true
          echo "Aguardando 30 segundos para liberação dos Load Balancers e interfaces de rede (ENI)..."
          sleep 30
