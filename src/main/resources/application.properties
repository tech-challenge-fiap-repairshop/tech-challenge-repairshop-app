spring.application.name=repairshop

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/repairshop}
spring.datasource.username=${DB_USERNAME:repairshop}
spring.datasource.password=${DB_PASSWORD:repairshop}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-key-that-must-be-changed-in-production-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.display-operation-id=false
springdoc.swagger-ui.deep-linking=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.probes.enabled=true
