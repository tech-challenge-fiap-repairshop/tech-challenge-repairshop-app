spring.datasource.url=jdbc:tc:postgresql:17:///repairshop_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=repairshop
spring.datasource.password=repairshop

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false

jwt.secret=test-secret-key-for-testing-purposes-only-at-least-256-bits-long-enough
jwt.expiration=86400000
