collector:
  otlp:
    enabled: true
    grpc:
      host_port: "0.0.0.0:4317"
    http:
      host_port: "0.0.0.0:4318"

query:
  base_path: "/"
  port: 16686

storage:
  type: memory
  options:
    memory:
      max_traces: 100000

sampling:
  strategies-file: /etc/jaeger/sampling-strategies.json
